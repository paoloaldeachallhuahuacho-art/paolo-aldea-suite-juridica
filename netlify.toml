[build]
  publish = "."
  functions = "netlify/functions"

# Bloqueo de archivos internos (no deben servirse publicamente)
[[redirects]]
  from = "/*.ps1"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.bat"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.vbs"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.sql"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/herramientas/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/central_cloud_data.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/alertas_locales.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/firestore.rules"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/firestore.indexes.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/firebase.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.server_token"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.server_port"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Reglas de Seguridad Avanzada, CSP, SSL y Políticas de Navegador
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src 'self' https: 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://cdn.tailwindcss.com; connect-src 'self' https: wss: https://*.supabase.co wss://*.supabase.co https://*.googleapis.com https://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; font-src 'self' https: data:; img-src 'self' https: data: blob:; style-src 'self' https: 'unsafe-inline'; base-uri 'self'; form-action 'self';"

# Caché Inmutable de Larga Duración para Librerías Pesadas y Fuentes (Ahorro de Ancho de Banda Móvil)
[[headers]]
  for = "/lib/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Service Worker PWA (Sin caché rígida para actualizaciones automáticas en celulares)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

# Manifiesto Oficial PWA
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
